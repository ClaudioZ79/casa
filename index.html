<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="theme-color" content="#f2f2f7">
<title>Casa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #f2f2f7;
    --card: rgba(255, 255, 255, .72);
    --text: #000;
    --sec: #8e8e93;
    --accent: #007aff;
    --red: #ff3b30;
    --orange: #ff9500;
    --sep: rgba(60, 60, 67, .18);
    --r: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000;
      --card: rgba(44, 44, 46, .7);
      --text: #fff;
      --sec: #8e8e93;
      --sep: rgba(84, 84, 88, .6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000;
    --card: rgba(44, 44, 46, .7);
    --text: #fff;
    --sec: #8e8e93;
    --sep: rgba(84, 84, 88, .6);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; color: inherit; }

  main { padding: 8px 16px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 34px; font-weight: 700; margin: 12px 0 4px; }
  h2 { font-size: 20px; font-weight: 700; margin: 22px 4px 8px; }
  .data, .sec { color: var(--sec); font-size: 14px; }
  .vuoto { color: var(--sec); margin: 6px 0; }

  .card {
    background: var(--card);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: .5px solid rgba(255, 255, 255, .4);
    border-radius: var(--r);
    box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
    padding: 4px 14px;
    margin-bottom: 12px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stat { padding: 14px; }
  .stat b { display: block; font-size: 30px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--sec); }
  .stat.largo { grid-column: 1 / -1; }

  .riga { display: flex; align-items: center; gap: 10px; padding: 11px 0; min-height: 44px; }
  .riga + .riga { border-top: .5px solid var(--sep); }
  .stanza-btn {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    width: 100%; background: none; border: 0; text-align: left; padding: 12px 0; min-height: 44px;
  }
  .stanza-btn + .riga { border-top: .5px solid var(--sep); }
  .titolo { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .link { color: var(--accent); background: none; border: 0; padding: 0; }
  .link input { display: none; }

  .chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 6px 0 10px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: .5px solid rgba(255, 255, 255, .4); border-radius: 999px;
    padding: 8px 14px; background: var(--card);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .chip.on { background: var(--accent); color: #fff; }

  .check {
    width: 26px; height: 26px; flex: none; border-radius: 50%;
    border: 2px solid var(--accent); background: none;
    display: grid; place-items: center; color: #fff; font-weight: 700;
  }
  .att.fatta .check { background: var(--accent); }
  .att.fatta .titolo { text-decoration: line-through; color: var(--sec); }
  .stelle { color: var(--orange); font-size: 13px; letter-spacing: 1px; }
  .del { border: 0; background: none; color: var(--red); font-size: 22px; padding: 4px 8px; line-height: 1; }

  .scorta .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .scorta.bassa .titolo { color: var(--red); }
  .tondo {
    width: 32px; height: 32px; flex: none; border: 0; border-radius: 50%;
    background: rgba(120, 120, 128, .16); font-size: 20px; line-height: 1;
    display: grid; place-items: center;
  }
  .tondo.primo { background: var(--accent); color: #fff; }
  .qta { min-width: 28px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

  .form { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
  .form input, .form select {
    background: rgba(120, 120, 128, .12); border: 0; border-radius: 12px;
    padding: 12px; width: 100%;
  }
  .due { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .primario {
    background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    padding: 12px; font-weight: 600;
  }

  .campo { display: flex; flex-direction: column; gap: 4px; }
  .campo > span { font-size: 13px; color: var(--sec); padding-left: 4px; }
  .persona {
    flex: none; border: 0; border-radius: 999px; padding: 3px 10px; font-size: 13px;
    background: rgba(0, 122, 255, .14); color: var(--accent);
  }
  .persona.nessuno { background: rgba(120, 120, 128, .14); color: var(--sec); }
  .titolo small { display: block; color: var(--sec); font-size: 13px; }

  .tabbar {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    max-width: 616px; margin: 0 auto;
    display: flex; justify-content: space-around; padding: 6px;
    border-radius: 26px;
    background: var(--card);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    border: .5px solid rgba(255, 255, 255, .45);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
  }
  .tab {
    flex: 1; border: 0; background: none; border-radius: 18px; padding: 6px 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--sec); font-size: 11px;
  }
  .tab .ico { font-size: 22px; line-height: 1.1; }
  .tab.on { color: var(--accent); background: rgba(120, 120, 128, .14); }
</style>
</head>
<body>
<main>
  <section id="generale" class="pagina" hidden></section>
  <section id="stanze" class="pagina" hidden></section>
  <section id="scorte" class="pagina" hidden></section>
</main>

<nav class="tabbar">
  <button class="tab" data-tab="generale"><span class="ico">🏠</span><span>Generale</span></button>
  <button class="tab" data-tab="stanze"><span class="ico">🧹</span><span>Stanze</span></button>
  <button class="tab" data-tab="scorte"><span class="ico">📦</span><span>Scorte</span></button>
</nav>

<script>
const STANZE = [
  { id: 'lavanderia', nome: 'Lavanderia', icona: '🧺' },
  { id: 'cucina', nome: 'Cucina', icona: '🍴' },
  { id: 'ingresso', nome: 'Ingresso', icona: '🚪' },
  { id: 'sala', nome: 'Sala', icona: '🛋️' },
  { id: 'bagno', nome: 'Bagno', icona: '🚿' },
  { id: 'camera', nome: 'Camera da letto', icona: '🛏️' },
];

const URG = {
  3: { etichetta: 'Urgenti', singolare: 'Urgente', sugg: 'Da fare subito' },
  2: { etichetta: 'Meno urgenti', singolare: 'Meno urgente', sugg: 'Entro questa settimana' },
  1: { etichetta: 'Facoltativi', singolare: 'Facoltativo', sugg: 'Se hai tempo' },
};

const PERSONE = [
  { id: 'claudio', nome: 'Claudio' },
  { id: 'monica', nome: 'Monica' },
];
const nomePersona = (id) => (PERSONE.find((p) => p.id === id) || {}).nome || '';

const KEY = 'casa.v1';
let dati = carica();
let stanzaSel = 'cucina';

function carica() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) {
      const j = JSON.parse(r);
      if (Array.isArray(j.attivita) && Array.isArray(j.scorte)) return j;
    }
  } catch (e) { /* storage non disponibile: si parte vuoti */ }
  return { attivita: [], scorte: [] };
}

// Salva solo su questo dispositivo.
function salvaLocale() {
  try { localStorage.setItem(KEY, JSON.stringify(dati)); } catch (e) { /* vedi README */ }
}

// Salva su questo dispositivo e, se la condivisione è attiva, la manda agli altri.
function salva() {
  salvaLocale();
  if (nube.sincronizza) nube.sincronizza();
  else if (nube.stato === 'offline') scriviFlag(FLAG_SPORCO, true);
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const trova = (lista, id) => lista.find((x) => x.id === id);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function render() {
  renderGenerale();
  renderStanze();
  renderScorte();
}

function renderGenerale() {
  const urgenti = dati.attivita.filter((a) => !a.fatta && a.urgenza === 3).length;
  const fatte = dati.attivita.filter((a) => a.fatta).length;
  const esaurimento = dati.scorte.filter((s) => s.quantita <= s.minimo).length;
  const oggi = cap(new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }));

  $('#generale').innerHTML = `
    <h1>Casa</h1>
    <p class="data">${esc(oggi)}</p>
    <div class="grid">
      <div class="card stat"><b>${urgenti}</b><span>Urgenti ancora da fare</span></div>
      <div class="card stat"><b>${fatte} / ${dati.attivita.length}</b><span>Attività completate</span></div>
      <div class="card stat largo"><b>${esaurimento}</b><span>Scorte in esaurimento</span></div>
    </div>
    <h2>Stanza per stanza</h2>
    <p class="sec">Sotto ogni stanza vedi gli impegni urgenti ancora da fare. Tocca il cerchio quando è fatto, il nome per cambiare chi lo fa, o la stanza per aprirla.</p>
    ${STANZE.map((s) => {
      const aperte = dati.attivita.filter((a) => a.stanza === s.id && !a.fatta);
      const urgentiStanza = aperte.filter((a) => a.urgenza === 3);
      const u = urgentiStanza.length;
      return `<div class="card">
        <button class="stanza-btn" data-vai="${s.id}">
          <span>${s.icona} ${esc(s.nome)}</span>
          <span class="sec">${u} urgent${u === 1 ? 'e' : 'i'} · ${aperte.length} da fare ›</span>
        </button>
        ${u ? urgentiStanza.map((a) => rigaAttivita(a, true)).join('') : '<p class="vuoto" style="padding:0 0 10px">Nessuna cosa urgente.</p>'}
      </div>`;
    }).join('')}
    ${htmlNube()}
    <h2>Dati</h2>
    <div class="card" style="padding:14px">
      <button class="link" data-action="esporta">Esporta JSON</button>
      &nbsp;·&nbsp;
      <label class="link">Importa JSON<input type="file" accept="application/json,.json" id="importa"></label>
    </div>
    ${nube.stato === 'attiva' ? '' : `<h2>Google Drive</h2>
    <div class="card" style="padding:14px">
      ${driveCollegato()
        ? `<button class="link" data-action="drive-carica" ${driveOccupato ? 'disabled' : ''}>Carica su Drive</button>
           &nbsp;·&nbsp;
           <button class="link" data-action="drive-scarica" ${driveOccupato ? 'disabled' : ''}>Scarica da Drive</button>
           &nbsp;·&nbsp;
           <button class="link" data-action="drive-scollega" style="color:var(--red)" ${driveOccupato ? 'disabled' : ''}>Scollega</button>`
        : `<button class="link" data-action="drive-collega" ${driveOccupato ? 'disabled' : ''}>Collega Google Drive</button>`}
      ${driveMsg ? `<p class="sec" style="margin:10px 0 0">${esc(driveMsg)}</p>` : ''}
    </div>`}
  `;
}

// compatta: usata nella Generale, nasconde stelle ed Elimina (tutte le righe sono già urgenti).
function rigaAttivita(a, compatta = false) {
  const chi = nomePersona(a.assegnata);
  return `<div class="riga att ${a.fatta ? 'fatta' : ''}">
    <button class="check" data-action="toggle" data-id="${a.id}" aria-label="Segna ${esc(a.titolo)}">${a.fatta ? '✓' : ''}</button>
    <span class="titolo">${esc(a.titolo)}</span>
    <button class="persona ${chi ? '' : 'nessuno'}" data-action="assegna" data-id="${a.id}" aria-label="Chi deve farlo: ${chi || 'nessuno'}. Tocca per cambiare">${chi ? esc(chi) : 'Assegna'}</button>
    ${compatta ? '' : `<span class="stelle">${'★'.repeat(a.urgenza)}</span>
    <button class="del" data-action="elimina" data-id="${a.id}" aria-label="Elimina ${esc(a.titolo)}">×</button>`}
  </div>`;
}

function renderStanze() {
  const tutte = dati.attivita.filter((a) => a.stanza === stanzaSel);
  const aperte = tutte.filter((a) => !a.fatta);
  const fatte = tutte.filter((a) => a.fatta);

  const gruppi = [3, 2, 1]
    .map((u) => ({ u, voci: aperte.filter((a) => a.urgenza === u) }))
    .filter((g) => g.voci.length > 0);

  $('#stanze').innerHTML = `
    <h1>Stanze</h1>
    <div class="chips">
      ${STANZE.map((s) => `<button class="chip ${s.id === stanzaSel ? 'on' : ''}" data-stanza="${s.id}">${s.icona} ${esc(s.nome)}</button>`).join('')}
    </div>

    ${gruppi.length === 0 ? '<div class="card"><p class="vuoto" style="padding:12px 0">Nessuna cosa da fare in questa stanza.</p></div>' : ''}
    ${gruppi.map((g) => `
      <h2>${URG[g.u].etichetta}</h2>
      <p class="sec">${URG[g.u].sugg}</p>
      <div class="card">${g.voci.map((a) => rigaAttivita(a)).join('')}</div>
    `).join('')}

    ${fatte.length ? `
      <h2>Completate</h2>
      <div class="card">${fatte.map((a) => rigaAttivita(a)).join('')}</div>
      <button class="link" data-action="pulisci" style="margin:0 4px 12px;color:var(--red)">Rimuovi le completate</button>
    ` : ''}

    <h2>Nuova attività</h2>
    <form class="card form" id="formAtt">
      <label class="campo"><span>Cosa va fatto</span>
        <input name="titolo" placeholder="Es. Pulire il forno" required></label>
      <label class="campo"><span>Quanto è urgente</span>
        <select name="urgenza">
          <option value="3">Urgente (3 stelle)</option>
          <option value="2">Meno urgente (2 stelle)</option>
          <option value="1">Facoltativo (1 stella)</option>
        </select></label>
      <label class="campo"><span>Chi lo fa</span>
        <select name="assegnata">
          <option value="">Nessuno in particolare</option>
          ${PERSONE.map((p) => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}
        </select></label>
      <button class="primario" type="submit">Aggiungi a ${esc(STANZE.find((s) => s.id === stanzaSel).nome)}</button>
    </form>
  `;
}

// Gli articoli con questa quantità o meno finiscono nella lista della spesa.
const SOGLIA_SPESA = 2;
const daComprare = () => dati.scorte.filter((s) => s.quantita <= SOGLIA_SPESA);

function rigaScorta(s, conElimina = true) {
  const bassa = s.quantita <= s.minimo;
  return `<div class="riga scorta ${bassa ? 'bassa' : ''}">
    <div class="info">
      <span class="titolo">${esc(s.nome)}</span>
      <span class="sec">${esc(s.categoria || '')}${s.categoria ? ' · ' : ''}minimo ${s.minimo}${s.unita ? ' ' + esc(s.unita) : ''}</span>
    </div>
    <button class="tondo" data-action="meno" data-id="${s.id}" aria-label="Diminuisci ${esc(s.nome)}">−</button>
    <span class="qta">${s.quantita}</span>
    <button class="tondo primo" data-action="piu" data-id="${s.id}" aria-label="Aumenta ${esc(s.nome)}">+</button>
    ${conElimina ? `<button class="del" data-action="elimina-scorta" data-id="${s.id}" aria-label="Elimina ${esc(s.nome)}">×</button>` : ''}
  </div>`;
}

function copiaSpesa() {
  const titolo = 'Lista della spesa';
  const testo = titolo + '\n' + daComprare().map((s) => `- ${s.nome}${s.unita ? ' (' + s.unita + ')' : ''}`).join('\n');
  if (navigator.share) {
    navigator.share({ title: titolo, text: testo }).catch(() => { /* annullato */ });
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(testo).then(() => alert('Lista copiata.')).catch(() => alert('Copia non riuscita.'));
  }
}

function renderScorte() {
  const spesa = daComprare();
  $('#scorte').innerHTML = `
    <h1>Scorte</h1>
    <h2>Lista della spesa</h2>
    <p class="sec">Qui compaiono gli articoli con ${SOGLIA_SPESA} unità o meno. Escono da soli quando li riporti sopra ${SOGLIA_SPESA}.</p>
    <div class="card">
      ${spesa.length ? spesa.map((s) => rigaScorta(s, false)).join('') : '<p class="vuoto" style="padding:12px 0">Niente da comprare.</p>'}
    </div>
    ${spesa.length ? '<button class="link" data-action="copia-spesa" style="margin:0 4px 12px">Condividi o copia la lista</button>' : ''}

    <h2>Tutte le scorte</h2>
    <div class="card">
      ${dati.scorte.length ? dati.scorte.map((s) => rigaScorta(s)).join('') : '<p class="vuoto" style="padding:12px 0">Nessun articolo.</p>'}
    </div>

    <h2>Nuovo articolo</h2>
    <form class="card form" id="formScorta">
      <label class="campo"><span>Nome dell'articolo</span>
        <input name="nome" placeholder="Es. Detersivo piatti" required></label>
      <label class="campo"><span>Categoria (facoltativa)</span>
        <input name="categoria" placeholder="Es. Cucina, Bagno, Pulizia"></label>
      <div class="due">
        <label class="campo"><span>Quanti ne hai adesso</span>
          <input name="quantita" type="number" min="0" value="0" inputmode="numeric"></label>
        <label class="campo"><span>Scorta minima</span>
          <input name="minimo" type="number" min="0" value="1" inputmode="numeric"></label>
      </div>
      <p class="sec" style="margin:-4px 4px 0">La scorta minima serve a evidenziare in rosso l'articolo. In lista della spesa finisce con ${SOGLIA_SPESA} unità o meno.</p>
      <label class="campo"><span>Unità di misura (facoltativa)</span>
        <input name="unita" placeholder="Es. pz, kg, l, rotoli"></label>
      <button class="primario" type="submit">Aggiungi</button>
    </form>
  `;
}

function vaiTab(nome) {
  document.querySelectorAll('.pagina').forEach((p) => { p.hidden = p.id !== nome; });
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === nome));
  window.scrollTo(0, 0);
}

function esporta() {
  const blob = new Blob([JSON.stringify(dati, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'casa-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-vai],[data-stanza],[data-action]');
  if (!t) return;

  if (t.dataset.tab) { vaiTab(t.dataset.tab); return; }
  if (t.dataset.vai) { stanzaSel = t.dataset.vai; render(); vaiTab('stanze'); return; }
  if (t.dataset.stanza) { stanzaSel = t.dataset.stanza; render(); return; }

  const id = t.dataset.id;
  switch (t.dataset.action) {
    case 'toggle': { const a = trova(dati.attivita, id); if (a) a.fatta = !a.fatta; break; }
    case 'elimina': dati.attivita = dati.attivita.filter((a) => a.id !== id); break;
    case 'assegna': {
      // Nessuno -> Claudio -> Monica -> Nessuno
      const a = trova(dati.attivita, id);
      if (a) {
        const i = PERSONE.findIndex((p) => p.id === a.assegnata);
        a.assegnata = i + 1 < PERSONE.length ? PERSONE[i + 1].id : '';
      }
      break;
    }
    case 'pulisci':
      if (!confirm('Rimuovere le attività completate di questa stanza?')) return;
      dati.attivita = dati.attivita.filter((a) => !(a.fatta && a.stanza === stanzaSel));
      break;
    case 'meno': { const s = trova(dati.scorte, id); if (s) s.quantita = Math.max(0, s.quantita - 1); break; }
    case 'piu': { const s = trova(dati.scorte, id); if (s) s.quantita += 1; break; }
    case 'elimina-scorta': dati.scorte = dati.scorte.filter((s) => s.id !== id); break;
    case 'esporta': esporta(); return;
    case 'copia-spesa': copiaSpesa(); return;
    case 'drive-collega': eseguiDrive(driveAccesso); return;
    case 'drive-carica': eseguiDrive(driveCarica); return;
    case 'drive-scarica':
      if (!confirm('Sostituire i dati di questo dispositivo con quelli salvati su Drive?')) return;
      eseguiDrive(driveScarica);
      return;
    case 'drive-scollega': driveScollega(); return;
    case 'cloud-accedi': accediNube(); return;
    case 'cloud-esci': esciNube(); return;
    default: return;
  }
  salva();
  render();
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  const d = Object.fromEntries(new FormData(f));

  if (f.id === 'formAtt') {
    const titolo = String(d.titolo || '').trim();
    if (!titolo) return;
    dati.attivita.push({
      id: uid(), titolo, stanza: stanzaSel,
      urgenza: Number(d.urgenza), fatta: false, creataIl: adesso(),
      assegnata: PERSONE.some((p) => p.id === d.assegnata) ? d.assegnata : '',
    });
  } else if (f.id === 'formScorta') {
    const nome = String(d.nome || '').trim();
    if (!nome) return;
    dati.scorte.push({
      id: uid(), nome,
      categoria: String(d.categoria || '').trim(),
      quantita: Math.max(0, parseInt(d.quantita, 10) || 0),
      minimo: Math.max(0, parseInt(d.minimo, 10) || 0),
      unita: String(d.unita || '').trim(),
    });
  } else {
    return;
  }
  salva();
  render();
});

document.addEventListener('change', (e) => {
  if (e.target.id !== 'importa') return;
  const file = e.target.files[0];
  if (!file) return;
  file.text()
    .then((t) => {
      const j = JSON.parse(t);
      if (!Array.isArray(j.attivita) || !Array.isArray(j.scorte)) throw new Error('formato non valido');
      if (nube.stato === 'attiva' && !confirm('La condivisione è attiva: importando questo file sostituirai le liste anche sugli altri telefoni. Continuare?')) return;
      dati = normalizza(j);
      salva();
      render();
      alert('Dati importati.');
    })
    .catch(() => alert('File non valido: serve un export JSON di Casa.'));
});

/* ---------- Google Drive ----------
   Il file casa.json sta in appDataFolder: una cartella nascosta, visibile solo a questa app.
   Formato compatibile con l'app Swift (stesso file, stessi nomi dei campi). */

// ID client OAuth di tipo "Applicazione web" (progetto Google Cloud casa-511922). Vedi README.
const GOOGLE_CLIENT_ID = '144660060564-a08p9onsupgugqf0v9ogddbu9bhb10r9.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE = 'casa.json';
const FLAG_DRIVE = 'casa.drive';

let driveToken = null;
let driveScade = 0;
let driveMsg = '';
let driveOccupato = false;
let tokenClient = null;
let accessoOk = null;
let accessoKo = null;

const adesso = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');

function driveCollegato() {
  try { return localStorage.getItem(FLAG_DRIVE) === '1'; } catch (e) { return false; }
}

function impostaFlagDrive(v) {
  try { v ? localStorage.setItem(FLAG_DRIVE, '1') : localStorage.removeItem(FLAG_DRIVE); } catch (e) { /* ignora */ }
}

function normalizza(j) {
  if (!j || !Array.isArray(j.attivita) || !Array.isArray(j.scorte)) throw new Error('formato non valido');
  return {
    attivita: j.attivita.map((a) => ({
      id: a.id || uid(),
      titolo: String(a.titolo || ''),
      stanza: String(a.stanza || 'sala'),
      urgenza: Number(a.urgenza) || 1,
      fatta: Boolean(a.fatta),
      creataIl: a.creataIl || adesso(),
      assegnata: PERSONE.some((p) => p.id === a.assegnata) ? a.assegnata : '',
    })),
    scorte: j.scorte.map((s) => ({
      id: s.id || uid(),
      nome: String(s.nome || ''),
      categoria: String(s.categoria || ''),
      quantita: Math.max(0, parseInt(s.quantita, 10) || 0),
      minimo: Math.max(0, parseInt(s.minimo, 10) || 0),
      unita: String(s.unita || ''),
    })),
  };
}

function driveAccesso() {
  return new Promise((ok, ko) => {
    if (driveToken && Date.now() < driveScade - 60000) { ok(driveToken); return; }
    if (!GOOGLE_CLIENT_ID) { ko(new Error("Manca l'ID client Google nel codice (vedi README).")); return; }
    if (!window.google || !google.accounts) { ko(new Error('Libreria Google non caricata: sei online?')); return; }

    accessoOk = ok;
    accessoKo = ko;
    if (!tokenClient) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: (r) => {
          if (r.error) { accessoKo(new Error(r.error_description || r.error)); return; }
          driveToken = r.access_token;
          driveScade = Date.now() + (Number(r.expires_in) || 3600) * 1000;
          impostaFlagDrive(true);
          accessoOk(driveToken);
        },
        error_callback: (e) => accessoKo(new Error('Accesso annullato o bloccato (' + (e.type || 'errore') + ').')),
      });
    }
    tokenClient.requestAccessToken({ prompt: driveCollegato() ? '' : 'consent' });
  });
}

async function driveFetch(url, opzioni = {}) {
  const token = await driveAccesso();
  const r = await fetch(url, { ...opzioni, headers: { ...(opzioni.headers || {}), Authorization: 'Bearer ' + token } });
  if (!r.ok) throw new Error('Errore di Google Drive (' + r.status + ').');
  return r;
}

async function driveIdFile() {
  const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`);
  const j = await r.json();
  return j.files && j.files[0] ? j.files[0].id : null;
}

async function driveCarica() {
  const id = await driveIdFile();
  const meta = id ? { name: DRIVE_FILE } : { name: DRIVE_FILE, parents: ['appDataFolder'] };
  const json = JSON.stringify({ versione: 1, attivita: dati.attivita, scorte: dati.scorte });
  const b = 'casa' + uid();
  const corpo = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`
    + `--${b}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${b}--`;
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files${id ? '/' + id : ''}?uploadType=multipart`, {
    method: id ? 'PATCH' : 'POST',
    headers: { 'Content-Type': 'multipart/related; boundary=' + b },
    body: corpo,
  });
}

async function driveScarica() {
  const id = await driveIdFile();
  if (!id) throw new Error('Nessun file su Drive: prima carica i dati.');
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  dati = normalizza(await r.json());
  salva();
}

function driveScollega() {
  if (driveToken && window.google && google.accounts) {
    try { google.accounts.oauth2.revoke(driveToken, () => {}); } catch (e) { /* ignora */ }
  }
  driveToken = null;
  driveScade = 0;
  impostaFlagDrive(false);
  driveMsg = 'Drive scollegato.';
  render();
}

// Va chiamata direttamente dal gesto dell'utente (clic): il popup di Google lo richiede.
function eseguiDrive(azione) {
  driveOccupato = true;
  driveMsg = '';
  render();
  azione()
    .then(() => { driveMsg = 'Operazione completata.'; })
    .catch((e) => { driveMsg = e.message || 'Operazione non riuscita.'; })
    .finally(() => { driveOccupato = false; render(); });
}

/* ---------- Condivisione con Firebase ----------
   Le liste stanno in Cloud Firestore (collezioni "attivita" e "scorte", un documento per voce),
   così Claudio e Monica vedono le stesse cose e le modifiche arrivano subito.
   Le regole del database (pubblicate nella console Firebase) lasciano entrare solo i due account.
   La chiave API di un'app web è un identificativo pubblico: la protezione sono le regole. */

const FB_CONFIG = {
  apiKey: 'AIzaSyBESayIo0hrpfAHWcX0yCHijq7vEx7Qk_0',
  authDomain: 'casa-511922.firebaseapp.com',
  projectId: 'casa-511922',
  storageBucket: 'casa-511922.firebasestorage.app',
  messagingSenderId: '144660060564',
  appId: '1:144660060564:web:8590c8df572290d85f5781',
};
const FB_VERSIONE = '11.0.2';
const FLAG_INIT = 'casa.cloud.init';
const FLAG_SPORCO = 'casa.cloud.sporco';
const TIPI_CLOUD = ['attivita', 'scorte'];

// stato: caricamento | offline | sconnesso | connessione | attiva
const nube = { stato: 'caricamento', utente: '', msg: '', pronta: false, api: null, sincronizza: null };
const ultimoCloud = { attivita: new Map(), scorte: new Map() };
let renderRimandato = false;

const stabile = (o) => JSON.stringify(Object.keys(o).sort().reduce((r, k) => { r[k] = o[k]; return r; }, {}));

function leggiFlag(k) {
  try { return localStorage.getItem(k) === '1'; } catch (e) { return false; }
}

function scriviFlag(k, v) {
  try { v ? localStorage.setItem(k, '1') : localStorage.removeItem(k); } catch (e) { /* ignora */ }
}

function normalizzaLista(tipo, lista) {
  const n = normalizza(tipo === 'attivita' ? { attivita: lista, scorte: [] } : { attivita: [], scorte: lista });
  return tipo === 'attivita'
    ? n.attivita.sort((a, b) => String(a.creataIl).localeCompare(String(b.creataIl)) || a.id.localeCompare(b.id))
    : n.scorte.sort((a, b) => a.nome.localeCompare(b.nome, 'it') || a.id.localeCompare(b.id));
}

function unisciListe(remote, locali) {
  const ids = new Set(remote.map((x) => x.id));
  return remote.concat(locali.filter((x) => !ids.has(x.id)));
}

function messaggioErroreNube(e) {
  const c = (e && e.code) || '';
  if (c.includes('popup-closed') || c.includes('cancelled-popup')) return 'Accesso annullato.';
  if (c.includes('popup-blocked')) return 'Il browser ha bloccato la finestra di accesso: riprova.';
  if (c.includes('permission-denied')) return "Questo account non è autorizzato: accedi con l'account di Claudio o di Monica.";
  if (c.includes('unauthorized-domain')) return 'Questo indirizzo non è autorizzato in Firebase.';
  if (c.includes('network')) return 'Nessuna connessione: riprova più tardi.';
  return (e && e.message) || 'Operazione non riuscita.';
}

function htmlNube() {
  let corpo;
  if (nube.stato === 'attiva') {
    corpo = `<p style="margin:0 0 8px">Condiviso. Sei collegato come <b>${esc(nube.utente)}</b>: le modifiche arrivano subito agli altri telefoni.</p>
      <button class="link" data-action="cloud-esci" style="color:var(--red)">Esci</button>`;
  } else if (nube.stato === 'sconnesso') {
    corpo = `<p style="margin:0 0 8px">Accedi con Google per condividere le liste con Claudio e Monica.</p>
      <button class="link" data-action="cloud-accedi">Accedi con Google</button>`;
  } else if (nube.stato === 'offline') {
    corpo = '<p style="margin:0">Condivisione non disponibile: serve la connessione a internet. Intanto puoi usare l\'app: le modifiche restano su questo telefono.</p>';
  } else {
    corpo = `<p style="margin:0">${nube.stato === 'connessione' ? 'Collegamento in corso…' : 'Caricamento…'}</p>`;
  }
  return `<h2>Condivisione</h2>
    <div class="card" style="padding:14px">${corpo}${nube.msg ? `<p class="sec" style="margin:10px 0 0">${esc(nube.msg)}</p>` : ''}</div>`;
}

// Va chiamata direttamente dal clic: il popup di Google lo richiede.
function accediNube() {
  if (!nube.api) return;
  nube.msg = '';
  nube.api.accedi().catch((e) => {
    nube.stato = 'sconnesso';
    nube.msg = messaggioErroreNube(e);
    render();
  });
}

function esciNube() {
  if (nube.api) nube.api.esci();
}

// Durante una modifica ricevuta dagli altri non ridisegna la pagina se stai scrivendo in un campo.
function renderSicuro() {
  const a = document.activeElement;
  if (a && a.matches && a.matches('input, select, textarea') && a.closest('form')) renderRimandato = true;
  else render();
}

document.addEventListener('focusout', () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (renderRimandato && !(a && a.closest && a.closest('form'))) { renderRimandato = false; render(); }
  }, 150);
});

async function avviaNube() {
  let fbApp; let fbAuth; let fbStore;
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VERSIONE}`;
    [fbApp, fbAuth, fbStore] = await Promise.all([
      import(`${base}/firebase-app.js`),
      import(`${base}/firebase-auth.js`),
      import(`${base}/firebase-firestore.js`),
    ]);
  } catch (e) {
    nube.stato = 'offline';
    render();
    return;
  }

  const { initializeApp } = fbApp;
  const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } = fbAuth;
  const { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
    collection, doc, setDoc, deleteDoc, getDocs, onSnapshot } = fbStore;

  const app = initializeApp(FB_CONFIG);
  const auth = getAuth(app);
  const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  let spegni = [];

  const errore = (e) => {
    nube.msg = messaggioErroreNube(e);
    if (e && e.code === 'permission-denied') signOut(auth);
    render();
  };

  // Manda al database solo le voci cambiate o eliminate rispetto all'ultimo stato noto.
  const sincronizza = () => {
    if (!nube.pronta) return;
    for (const t of TIPI_CLOUD) {
      const correnti = new Map(dati[t].map((x) => [x.id, x]));
      for (const [id, x] of correnti) {
        const s = stabile(x);
        if (ultimoCloud[t].get(id) !== s) {
          ultimoCloud[t].set(id, s);
          setDoc(doc(db, t, id), x).catch(errore);
        }
      }
      for (const id of [...ultimoCloud[t].keys()]) {
        if (!correnti.has(id)) {
          ultimoCloud[t].delete(id);
          deleteDoc(doc(db, t, id)).catch(errore);
        }
      }
    }
  };

  const avvia = async () => {
    try {
      const remote = {};
      for (const t of TIPI_CLOUD) {
        const snap = await getDocs(collection(db, t));
        remote[t] = normalizzaLista(t, snap.docs.map((d) => ({ ...d.data(), id: d.id })));
      }
      const haLocali = dati.attivita.length + dati.scorte.length > 0;
      const daChiedere = haLocali && (!leggiFlag(FLAG_INIT) || leggiFlag(FLAG_SPORCO));
      const unire = daChiedere && confirm(
        'Vuoi aggiungere alle liste condivise anche i dati già presenti su questo telefono?\n\nOK = aggiungili\nAnnulla = usa solo le liste condivise',
      );
      for (const t of TIPI_CLOUD) {
        ultimoCloud[t] = new Map(remote[t].map((x) => [x.id, stabile(x)]));
        dati[t] = unire ? unisciListe(remote[t], normalizzaLista(t, dati[t])) : remote[t];
      }
      scriviFlag(FLAG_INIT, true);
      scriviFlag(FLAG_SPORCO, false);
      nube.pronta = true;
      nube.stato = 'attiva';
      nube.msg = '';
      salvaLocale();
      sincronizza();
      render();
      for (const t of TIPI_CLOUD) {
        spegni.push(onSnapshot(collection(db, t), (snap) => {
          const lista = normalizzaLista(t, snap.docs.map((d) => ({ ...d.data(), id: d.id })));
          ultimoCloud[t] = new Map(lista.map((x) => [x.id, stabile(x)]));
          dati[t] = lista;
          salvaLocale();
          renderSicuro();
        }, errore));
      }
    } catch (e) {
      nube.pronta = false;
      nube.stato = 'sconnesso';
      errore(e);
    }
  };

  nube.api = {
    accedi: () => signInWithPopup(auth, provider),
    esci: () => signOut(auth),
  };
  nube.sincronizza = sincronizza;

  onAuthStateChanged(auth, (utente) => {
    spegni.forEach((f) => f());
    spegni = [];
    nube.pronta = false;
    if (!utente) {
      nube.utente = '';
      nube.stato = 'sconnesso';
      render();
      return;
    }
    nube.utente = utente.email || '';
    nube.stato = 'connessione';
    render();
    avvia();
  });
}

render();
vaiTab('generale');
avviaNube();
</script>
