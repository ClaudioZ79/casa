<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="theme-color" content="#f2f2f7">
<title>Casa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #f2f2f7;
    --card: rgba(255, 255, 255, .72);
    --text: #000;
    --sec: #8e8e93;
    --accent: #007aff;
    --red: #ff3b30;
    --orange: #ff9500;
    --rosa: #ff2d92;
    --sep: rgba(60, 60, 67, .18);
    --r: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000;
      --card: rgba(44, 44, 46, .7);
      --text: #fff;
      --sec: #8e8e93;
      --sep: rgba(84, 84, 88, .6);
      --rosa: #ff69b4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000;
    --card: rgba(44, 44, 46, .7);
    --text: #fff;
    --sec: #8e8e93;
    --sep: rgba(84, 84, 88, .6);
    --rosa: #ff69b4;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; color: inherit; }

  main { padding: 8px 16px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 34px; font-weight: 700; margin: 12px 0 4px; }
  h2 { font-size: 20px; font-weight: 700; margin: 22px 4px 8px; }
  .data, .sec { color: var(--sec); font-size: 14px; }
  .vuoto { color: var(--sec); margin: 6px 0; }

  .card {
    background: var(--card);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: .5px solid rgba(255, 255, 255, .4);
    border-radius: var(--r);
    box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
    padding: 4px 14px;
    margin-bottom: 12px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stat { padding: 14px; }
  .stat b { display: block; font-size: 30px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--sec); }
  .stat.largo { grid-column: 1 / -1; }

  .riga { display: flex; align-items: center; gap: 10px; padding: 11px 0; min-height: 44px; }
  .riga + .riga { border-top: .5px solid var(--sep); }
  .stanza-btn {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    width: 100%; background: none; border: 0; text-align: left; padding: 12px 0; min-height: 44px;
  }
  .stanza-btn + .riga { border-top: .5px solid var(--sep); }
  .gruppo + .gruppo { border-top: .5px solid var(--sep); }
  .gruppo-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0;
    text-align: left; padding: 12px 0; min-height: 44px; font-weight: 600;
  }
  .gruppo-btn .freccia { color: var(--sec); transition: transform .15s; display: inline-block; }
  .gruppo-btn[aria-expanded="true"] .freccia { transform: rotate(90deg); }
  .gruppo-btn .nome { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .gruppo-btn .conta { font-weight: 400; font-size: 14px; color: var(--sec); }
  .gruppo-btn .conta.bassa { color: var(--red); }
  .titolo { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .link { color: var(--accent); background: none; border: 0; padding: 0; }
  .link input { display: none; }

  .chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 6px 0 10px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: .5px solid rgba(255, 255, 255, .4); border-radius: 999px;
    padding: 8px 14px; background: var(--card);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .chip.on { background: var(--accent); color: #fff; }

  .check {
    width: 26px; height: 26px; flex: none; border-radius: 50%;
    border: 2px solid var(--accent); background: none;
    display: grid; place-items: center; color: #fff; font-weight: 700;
  }
  .att.fatta .check { background: var(--accent); }
  .att.fatta .titolo { color: var(--sec); }
  .att.fatta .testo { text-decoration: line-through; } /* barrato solo il titolo, non le scritte sotto */
  /* Le stelle sono un pulsante: toccandole l'urgenza cambia (1 → 2 → 3 → 1). Le vuote restano in grigio. */
  .stelle {
    flex: none; border: 0; background: none; color: var(--orange); font-size: 15px; letter-spacing: 1px;
    padding: 0 4px; min-height: 44px; min-width: 52px; white-space: nowrap;
  }
  .stelle .vuote { color: rgba(120, 120, 128, .35); }
  .segnaposto { width: 26px; flex: none; }
  /* Il nome è un pulsante senza aspetto da pulsante: toccandolo si corregge */
  .modificabile { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: text; }
  .info .modificabile { display: block; }
  .riga.modifica { flex-wrap: wrap; gap: 8px; }
  .modifica input {
    flex: 1 1 150px; min-width: 0; border: 0; border-radius: 12px; padding: 10px 12px;
    background: rgba(120, 120, 128, .12); font: inherit; color: inherit;
  }
  .primario.piccolo { padding: 10px 16px; }

  /* Su ogni scorta: due pulsanti per decidere se va nella lista della spesa */
  .riga.scorta { flex-wrap: wrap; }
  .azioni-spesa { flex: 0 0 100%; display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 4px; }
  .az { border: 0; border-radius: 999px; padding: 7px 14px; min-height: 34px; font-size: 13px; font-weight: 500; background: rgba(120, 120, 128, .14); color: var(--accent); }
  span.az { display: inline-flex; align-items: center; }
  .az.attiva { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .az.no { color: var(--sec); }
  .az.no.attiva { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
  .ripeti { display: block; border: 0; background: none; padding: 6px 0 2px; font-size: 13px; color: var(--sec); text-align: left; }
  .ripeti.attiva { color: var(--accent); }
  .del { border: 0; background: none; color: var(--red); font-size: 22px; padding: 4px 8px; line-height: 1; }

  .scorta .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .scorta.bassa .titolo { color: var(--red); }
  .tondo {
    width: 32px; height: 32px; flex: none; border: 0; border-radius: 50%;
    background: rgba(120, 120, 128, .16); font-size: 20px; line-height: 1;
    display: grid; place-items: center;
  }
  .tondo.primo { background: var(--accent); color: #fff; }
  .qta { min-width: 28px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

  .form { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
  .form input, .form select {
    background: rgba(120, 120, 128, .12); border: 0; border-radius: 12px;
    padding: 12px; width: 100%;
  }
  .due { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .primario {
    background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    padding: 12px; font-weight: 600;
  }

  .campo { display: flex; flex-direction: column; gap: 4px; }
  .campo > span { font-size: 13px; color: var(--sec); padding-left: 4px; }
  .persona {
    flex: none; border: 0; border-radius: 999px; padding: 3px 10px; font-size: 13px;
    background: rgba(0, 122, 255, .14); color: var(--accent);
  }
  .persona.nessuno { background: rgba(120, 120, 128, .14); color: var(--sec); }
  .persona.monica { background: color-mix(in srgb, var(--rosa) 18%, transparent); color: var(--rosa); }

  /* Scelta di chi fa l'attività: tre pulsanti al posto del menu a tendina */
  .scelta { display: flex; flex-wrap: wrap; gap: 8px; }
  .pillola { position: relative; }
  .pillola input { position: absolute; opacity: 0; pointer-events: none; }
  .pillola span {
    display: inline-block; min-height: 40px; padding: 9px 16px; border-radius: 999px;
    background: rgba(120, 120, 128, .12); color: var(--sec); font-weight: 500;
  }
  .pillola.claudio span { color: var(--accent); }
  .pillola.monica span { color: var(--rosa); }
  .pillola input:checked + span { background: var(--sec); color: #fff; }
  .pillola.claudio input:checked + span { background: var(--accent); color: #fff; }
  .pillola.monica input:checked + span { background: var(--rosa); color: #fff; }
  .pillola.rip input:checked + span { background: var(--accent); color: #fff; }
  .pillola input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .titolo small { display: block; color: var(--sec); font-size: 13px; }

  .tabbar {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    max-width: 616px; margin: 0 auto;
    display: flex; justify-content: space-around; padding: 6px;
    border-radius: 26px;
    background: var(--card);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    border: .5px solid rgba(255, 255, 255, .45);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
  }
  .tab {
    flex: 1; border: 0; background: none; border-radius: 18px; padding: 6px 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--sec); font-size: 11px;
  }
  .tab .ico { font-size: 22px; line-height: 1.1; }
  .tab.on { color: var(--accent); background: rgba(120, 120, 128, .14); }
</style>
</head>
<body>
<main>
  <section id="generale" class="pagina" hidden></section>
  <section id="stanze" class="pagina" hidden></section>
  <section id="scorte" class="pagina" hidden></section>
  <section id="spesa" class="pagina" hidden></section>
</main>

<nav class="tabbar">
  <button class="tab" data-tab="generale"><span class="ico">🏠</span><span>Generale</span></button>
  <button class="tab" data-tab="stanze"><span class="ico">🧹</span><span>Stanze</span></button>
  <button class="tab" data-tab="scorte"><span class="ico">📦</span><span>Scorte</span></button>
  <button class="tab" data-tab="spesa"><span class="ico">🛒</span><span>Spesa</span></button>
</nav>

<script>
const STANZE = [
  { id: 'lavanderia', nome: 'Lavanderia', icona: '🧺' },
  { id: 'cucina', nome: 'Cucina', icona: '🍴' },
  { id: 'ingresso', nome: 'Ingresso', icona: '🚪' },
  { id: 'sala', nome: 'Sala', icona: '🛋️' },
  { id: 'bagno', nome: 'Bagno', icona: '🚿' },
  { id: 'camera', nome: 'Camera da letto', icona: '🛏️' },
];

const URG = {
  3: { etichetta: 'Urgenti', singolare: 'Urgente', sugg: 'Da fare subito' },
  2: { etichetta: 'Meno urgenti', singolare: 'Meno urgente', sugg: 'Entro questa settimana' },
  1: { etichetta: 'Facoltativi', singolare: 'Facoltativo', sugg: 'Se hai tempo' },
};

const PERSONE = [
  { id: 'claudio', nome: 'Claudio' },
  { id: 'monica', nome: 'Monica' },
];
const nomePersona = (id) => (PERSONE.find((p) => p.id === id) || {}).nome || '';

const KEY = 'casa.v1';
let dati = carica();
let stanzaSel = 'cucina';

function carica() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) {
      const j = JSON.parse(r);
      if (Array.isArray(j.attivita) && Array.isArray(j.scorte)) {
        if (!Array.isArray(j.spesa)) j.spesa = [];
        return j;
      }
    }
  } catch (e) { /* storage non disponibile: si parte vuoti */ }
  return { attivita: [], scorte: [], spesa: [] };
}

// Salva solo su questo dispositivo.
function salvaLocale() {
  try { localStorage.setItem(KEY, JSON.stringify(dati)); } catch (e) { /* vedi README */ }
}

// Salva su questo dispositivo e, se la condivisione è attiva, la manda agli altri.
function salva() {
  riallineaSpesa();
  salvaLocale();
  if (nube.sincronizza) nube.sincronizza();
  else if (nube.stato === 'offline') scriviFlag(FLAG_SPORCO, true);
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const trova = (lista, id) => lista.find((x) => x.id === id);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Ripetizioni: ogni giorno / settimana / mese ----------
   Un impegno che si ripete ha tre campi in più: ripeti (giorno | settimana | mese),
   inizio (la prima volta, formato AAAA-MM-GG) e fattaIl (l'ultima volta che l'hai segnato fatto).
   Le date in cui "torna" si calcolano da inizio, quindi non serve salvarle e restano sempre
   agganciate allo stesso giorno (lo stesso giorno della settimana o del mese).
   Stato di un impegno: 'aperta' = da fare ora · 'fatta' = fatta (per i ripetuti: in questo giro)
   · 'programmata' = non è ancora iniziato. */

let OGGI_FORZATO = null; // serve solo per le prove con date simulate
const due = (n) => String(n).padStart(2, '0');
const isoData = (d) => `${d.getFullYear()}-${due(d.getMonth() + 1)}-${due(d.getDate())}`;
const oggi = () => OGGI_FORZATO || isoData(new Date());
const daIso = (s) => { const [y, m, g] = s.split('-').map(Number); return new Date(y, m - 1, g); };
const RIPETIZIONI = { giorno: 'ogni giorno', settimana: 'ogni settimana', mese: 'ogni mese' };
const ORDINE_RIPETIZIONI = ['', 'giorno', 'settimana', 'mese'];
const ripetizioneValida = (v) => Object.prototype.hasOwnProperty.call(RIPETIZIONI, v);
// Una data è valida se, riconvertita in testo, torna identica: JavaScript "aggiusta" da solo il 45 del 13° mese.
const dataValida = (s) => typeof s === 'string' && /^\d{4}-\d\d-\d\d$/.test(s) && isoData(daIso(s)) === s;

// La k-esima data in cui l'impegno torna (k = 0 è la prima volta).
function occorrenza(a, k) {
  const b = daIso(a.inizio);
  const y = b.getFullYear(); const m = b.getMonth(); const g = b.getDate();
  if (a.ripeti === 'giorno') return new Date(y, m, g + k);
  if (a.ripeti === 'settimana') return new Date(y, m, g + 7 * k);
  const ultimoDelMese = new Date(y, m + k + 1, 0).getDate(); // il 31 in un mese corto diventa l'ultimo giorno
  return new Date(y, m + k, Math.min(g, ultimoDelMese));
}

// ultima: la data più recente (oggi compreso) in cui era da fare · prossima: la prima dopo oggi.
function ciclo(a) {
  const t = daIso(oggi());
  const b = daIso(a.inizio);
  if (t < b) return { ultima: null, prossima: isoData(b) };
  let k;
  if (a.ripeti === 'mese') {
    k = (t.getFullYear() - b.getFullYear()) * 12 + (t.getMonth() - b.getMonth());
    if (occorrenza(a, k) > t) k -= 1;
  } else {
    const giorni = Math.round((t - b) / 86400000); // round: assorbe l'ora legale
    k = a.ripeti === 'settimana' ? Math.floor(giorni / 7) : giorni;
  }
  return { ultima: isoData(occorrenza(a, k)), prossima: isoData(occorrenza(a, k + 1)) };
}

function statoAttivita(a) {
  if (!a.ripeti) return a.fatta ? 'fatta' : 'aperta';
  const c = ciclo(a);
  if (!c.ultima) return 'programmata';
  return a.fattaIl && a.fattaIl >= c.ultima ? 'fatta' : 'aperta';
}

const dataBreve = (iso) => daIso(iso).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });

function testoRipetizione(a) {
  if (!a.ripeti) return 'Non si ripete';
  const base = '↻ ' + cap(RIPETIZIONI[a.ripeti]);
  const stato = statoAttivita(a);
  if (stato === 'programmata') return `${base} · parte il ${dataBreve(ciclo(a).prossima)}`;
  if (stato === 'fatta') return `${base} · torna il ${dataBreve(ciclo(a).prossima)}`;
  return base;
}

// Tocco sull'etichetta: Non si ripete → ogni giorno → ogni settimana → ogni mese → Non si ripete.
function cambiaRipetizione(a) {
  const eraFatta = statoAttivita(a) === 'fatta';
  const nuova = ORDINE_RIPETIZIONI[(ORDINE_RIPETIZIONI.indexOf(a.ripeti || '') + 1) % ORDINE_RIPETIZIONI.length];
  if (!a.ripeti && nuova) { // da singolo a ripetuto: parte da oggi, e se era fatto vale "fatto oggi"
    a.inizio = oggi();
    a.fattaIl = a.fatta ? oggi() : '';
    a.fatta = false;
  } else if (a.ripeti && !nuova) { // da ripetuto a singolo: resta com'è adesso
    a.fatta = eraFatta;
    delete a.inizio;
    delete a.fattaIl;
  }
  if (nuova) a.ripeti = nuova; else delete a.ripeti;
}

function render() {
  renderGenerale();
  renderStanze();
  renderScorte();
  renderSpesa();
}

function renderGenerale() {
  const urgenti = dati.attivita.filter((a) => statoAttivita(a) === 'aperta' && a.urgenza === 3).length;
  const fatte = dati.attivita.filter((a) => statoAttivita(a) === 'fatta').length;
  const iniziate = dati.attivita.filter((a) => statoAttivita(a) !== 'programmata').length;
  const esaurimento = dati.scorte.filter((s) => s.quantita <= s.minimo).length;
  const oggi = cap(new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }));

  $('#generale').innerHTML = `
    <h1>Casa</h1>
    <p class="data">${esc(oggi)}</p>
    <div class="grid">
      <div class="card stat"><b>${urgenti}</b><span>Urgenti ancora da fare</span></div>
      <div class="card stat"><b>${fatte} / ${iniziate}</b><span>Attività completate</span></div>
      <div class="card stat largo"><b>${esaurimento}</b><span>Scorte in esaurimento</span></div>
    </div>
    <h2>Stanza per stanza</h2>
    <p class="sec">Sotto ogni stanza vedi gli impegni urgenti ancora da fare. Tocca il cerchio quando è fatto, il nome per cambiare chi lo fa, o la stanza per aprirla.</p>
    ${STANZE.map((s) => {
      const aperte = dati.attivita.filter((a) => a.stanza === s.id && statoAttivita(a) === 'aperta');
      const urgentiStanza = aperte.filter((a) => a.urgenza === 3);
      const u = urgentiStanza.length;
      return `<div class="card">
        <button class="stanza-btn" data-vai="${s.id}">
          <span>${s.icona} ${esc(s.nome)}</span>
          <span class="sec">${u} urgent${u === 1 ? 'e' : 'i'} · ${aperte.length} da fare ›</span>
        </button>
        ${u ? urgentiStanza.map((a) => rigaAttivita(a, true)).join('') : '<p class="vuoto" style="padding:0 0 10px">Nessuna cosa urgente.</p>'}
      </div>`;
    }).join('')}
    ${htmlNube()}
    <h2>Dati</h2>
    <div class="card" style="padding:14px">
      <button class="link" data-action="esporta">Esporta JSON</button>
      &nbsp;·&nbsp;
      <label class="link">Importa JSON<input type="file" accept="application/json,.json" id="importa"></label>
    </div>
    ${nube.stato === 'attiva' ? '' : `<h2>Google Drive</h2>
    <div class="card" style="padding:14px">
      ${driveCollegato()
        ? `<button class="link" data-action="drive-carica" ${driveOccupato ? 'disabled' : ''}>Carica su Drive</button>
           &nbsp;·&nbsp;
           <button class="link" data-action="drive-scarica" ${driveOccupato ? 'disabled' : ''}>Scarica da Drive</button>
           &nbsp;·&nbsp;
           <button class="link" data-action="drive-scollega" style="color:var(--red)" ${driveOccupato ? 'disabled' : ''}>Scollega</button>`
        : `<button class="link" data-action="drive-collega" ${driveOccupato ? 'disabled' : ''}>Collega Google Drive</button>`}
      ${driveMsg ? `<p class="sec" style="margin:10px 0 0">${esc(driveMsg)}</p>` : ''}
    </div>`}
  `;
}

/* ---------- Correggere i nomi ----------
   Toccando il nome di un impegno, di una scorta o di una voce della spesa la riga diventa un campo
   con Salva e Annulla. "modifica" ricorda quale riga stai correggendo e il testo già scritto,
   così un aggiornamento in arrivo dall'altro telefono non lo cancella. */

let modifica = null; // { tipo: 'attivita' | 'scorta' | 'spesa', id, testo? }
const inModifica = (tipo, id) => !!modifica && modifica.tipo === tipo && modifica.id === id;

function htmlModifica(tipo, id, corrente) {
  const valore = modifica.testo !== undefined ? modifica.testo : corrente;
  return `<form class="riga modifica" data-tipo="${tipo}" data-id="${id}">
    <input name="testo" value="${esc(valore)}" maxlength="80" required autocomplete="off" aria-label="Nuovo nome">
    <button class="primario piccolo" type="submit">Salva</button>
    <button class="link" type="button" data-action="modifica-annulla">Annulla</button>
  </form>`;
}

// Cambia il nome. Il nome di una scorta si porta dietro le sue voci nella lista della spesa.
function rinomina(tipo, id, nuovo) {
  if (tipo === 'attivita') {
    const a = trova(dati.attivita, id);
    if (a) a.titolo = nuovo;
  } else if (tipo === 'scorta') {
    const s = trova(dati.scorte, id);
    if (s) {
      s.nome = nuovo;
      dati.spesa.forEach((x) => { if (x.scortaId === id) x.nome = nuovo; });
    }
  } else if (tipo === 'spesa') {
    const x = trova(dati.spesa, id);
    if (x && x.scortaId && trova(dati.scorte, x.scortaId)) rinomina('scorta', x.scortaId, nuovo);
    else if (x) x.nome = nuovo;
  }
}

// Mette il cursore nel campo appena aperto (nella pagina che si sta guardando).
function focusModifica() {
  const campo = document.querySelector('.pagina:not([hidden]) form.modifica input[name="testo"]');
  if (!campo) return;
  campo.focus();
  campo.setSelectionRange(campo.value.length, campo.value.length);
}

// compatta: usata nella Generale, nasconde stelle ed Elimina (tutte le righe sono già urgenti).
function rigaAttivita(a, compatta = false) {
  if (inModifica('attivita', a.id)) return htmlModifica('attivita', a.id, a.titolo);
  const chi = nomePersona(a.assegnata);
  const stato = statoAttivita(a);
  const fatta = stato === 'fatta';
  // Nella Generale la ripetizione è solo un'indicazione; nelle stanze è un pulsante che la cambia.
  const ripetizione = compatta
    ? (a.ripeti ? `<small>${esc(testoRipetizione(a))}</small>` : '')
    : `<button class="ripeti ${a.ripeti ? 'attiva' : ''}" data-action="ripeti" data-id="${a.id}" aria-label="Si ripete: ${a.ripeti ? RIPETIZIONI[a.ripeti] : 'no'}. Tocca per cambiare">${esc(testoRipetizione(a))}</button>`;
  return `<div class="riga att ${fatta ? 'fatta' : ''}">
    ${stato === 'programmata'
      ? '<span class="segnaposto"></span>'
      : `<button class="check" data-action="toggle" data-id="${a.id}" aria-label="Segna ${esc(a.titolo)}">${fatta ? '✓' : ''}</button>`}
    <span class="titolo"><button class="testo modificabile" data-action="modifica-inizia" data-tipo="attivita" data-id="${a.id}" aria-label="Correggi il nome: ${esc(a.titolo)}">${esc(a.titolo)}</button>${ripetizione}</span>
    <button class="persona ${chi ? a.assegnata : 'nessuno'}" data-action="assegna" data-id="${a.id}" aria-label="Chi deve farlo: ${chi || 'nessuno'}. Tocca per cambiare">${chi ? esc(chi) : 'Assegna'}</button>
    ${compatta ? '' : `<button class="stelle" data-action="urgenza" data-id="${a.id}" aria-label="Urgenza: ${a.urgenza} stelle su 3. Tocca per cambiarla">${'★'.repeat(a.urgenza)}<span class="vuote">${'★'.repeat(3 - a.urgenza)}</span></button>
    <button class="del" data-action="elimina" data-id="${a.id}" aria-label="Elimina ${esc(a.titolo)}">×</button>`}
  </div>`;
}

// Quando una scorta scende a questa quantità (o meno) entra da sola nella lista della spesa.
const SOGLIA_SPESA = 2;

// Voci da comprare: né già comprate né tolte a mano ("tolto" = nascosta ma ricordata, vedi sotto).
const aperteSpesa = () => dati.spesa.filter((x) => !x.comprato && !x.tolto);

// Quanti pezzi servono per tornare sopra la soglia.
const pezziSuggeriti = (s) => Math.max(1, SOGLIA_SPESA + 1 - s.quantita);

// La lista segue lo stato delle scorte, non gli eventi: ogni scorta a SOGLIA_SPESA unità o meno
// ha una voce da comprare, anche se era già bassa prima. Si richiama a ogni salvataggio.
//  - Se togli a mano una voce mentre la scorta è bassa, resta come "tolto": non rientra da sola
//    finché la scorta non risale sopra la soglia.
//  - L'id è deterministico (auto-<scorta>-<n>): se due telefoni la creano nello stesso momento
//    scrivono lo stesso documento e non nascono doppioni.
//  - Finché non la modifichi tu, la quantità proposta segue la scorta.
// Restituisce true se ha cambiato qualcosa.
function riallineaSpesa() {
  if (nube.stato === 'attiva' && !nube.pronta) return false; // aspetta i dati condivisi
  let cambiato = false;
  for (const s of dati.scorte) {
    const sue = dati.spesa.filter((x) => x.scortaId === s.id);
    // Se la scorta è stata rinominata (anche dall'altro telefono) le sue voci ne prendono il nome.
    for (const x of sue) {
      if (x.nome !== s.nome) { x.nome = s.nome; cambiato = true; }
    }
    if (s.quantita > SOGLIA_SPESA) {
      const tolte = sue.filter((x) => x.tolto);
      if (tolte.length) {
        dati.spesa = dati.spesa.filter((x) => !tolte.includes(x));
        cambiato = true;
      }
      continue;
    }
    if (s.nonInLista) continue; // l'hai escluso col pulsante "Non aggiungere": non entra da solo in lista
    const aperta = sue.find((x) => !x.comprato);
    if (aperta) {
      const q = pezziSuggeriti(s);
      if (aperta.auto && !aperta.tolto && aperta.quantita !== q) { aperta.quantita = q; cambiato = true; }
      continue;
    }
    dati.spesa.push({
      id: `auto-${s.id}-${sue.length}`, nome: s.nome, quantita: pezziSuggeriti(s), unita: s.unita || '',
      comprato: false, scortaId: s.id, auto: true, creataIl: adesso(),
    });
    cambiato = true;
  }
  return cambiato;
}

// La scorta ha una voce ancora da comprare in lista (né già comprata né tolta a mano)?
const inListaScorta = (s) => dati.spesa.some((x) => x.scortaId === s.id && !x.comprato && !x.tolto);

// Pulsante "Aggiungi alla spesa": la mette in lista adesso, anche se la scorta non è bassa.
function aggiungiScortaAllaSpesa(s) {
  if (inListaScorta(s)) return;
  const tolta = dati.spesa.find((x) => x.scortaId === s.id && !x.comprato && x.tolto);
  if (tolta) { delete tolta.tolto; return; } // era stata tolta a mano: la rimetto
  dati.spesa.push({
    id: uid(), nome: s.nome, quantita: pezziSuggeriti(s), unita: s.unita || '',
    comprato: false, scortaId: s.id, creataIl: adesso(),
  });
}

// Pulsante "Non aggiungere": la scorta non entra più da sola in lista e le sue voci ancora da comprare spariscono.
// Premuto di nuovo torna automatica. "Aggiungi alla spesa" funziona comunque, una volta sola.
function escludiScortaDallaSpesa(s) {
  if (s.nonInLista) { delete s.nonInLista; return; }
  s.nonInLista = true;
  dati.spesa = dati.spesa.filter((x) => !(x.scortaId === s.id && !x.comprato));
}

function rigaScorta(s, conElimina = true) {
  if (inModifica('scorta', s.id)) return htmlModifica('scorta', s.id, s.nome);
  const bassa = s.quantita <= s.minimo;
  const azioni = conElimina ? `<div class="azioni-spesa">
      ${inListaScorta(s)
        ? '<span class="az attiva">✓ In lista della spesa</span>'
        : `<button class="az" data-action="spesa-aggiungi" data-id="${s.id}">🛒 Aggiungi alla spesa</button>`}
      <button class="az no ${s.nonInLista ? 'attiva' : ''}" data-action="spesa-escludi" data-id="${s.id}" aria-pressed="${s.nonInLista ? 'true' : 'false'}">${s.nonInLista ? '🚫 Non aggiungere ✓' : 'Non aggiungere'}</button>
    </div>` : '';
  return `<div class="riga scorta ${bassa ? 'bassa' : ''}">
    <div class="info">
      <span class="titolo"><button class="testo modificabile" data-action="modifica-inizia" data-tipo="scorta" data-id="${s.id}" aria-label="Correggi il nome: ${esc(s.nome)}">${esc(s.nome)}</button></span>
      <span class="sec">${esc(s.categoria || '')}${s.categoria ? ' · ' : ''}minimo ${s.minimo}${s.unita ? ' ' + esc(s.unita) : ''}</span>
    </div>
    <button class="tondo" data-action="meno" data-id="${s.id}" aria-label="Diminuisci ${esc(s.nome)}">−</button>
    <span class="qta">${s.quantita}</span>
    <button class="tondo primo" data-action="piu" data-id="${s.id}" aria-label="Aumenta ${esc(s.nome)}">+</button>
    ${conElimina ? `<button class="del" data-action="elimina-scorta" data-id="${s.id}" aria-label="Elimina ${esc(s.nome)}">×</button>` : ''}
    ${azioni}
  </div>`;
}

function copiaSpesa() {
  const titolo = 'Lista della spesa';
  const testo = titolo + '\n' + aperteSpesa().map((x) => `- ${x.nome} × ${x.quantita}${x.unita ? ' ' + x.unita : ''}`).join('\n');
  if (navigator.share) {
    navigator.share({ title: titolo, text: testo }).catch(() => { /* annullato */ });
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(testo).then(() => alert('Lista copiata.')).catch(() => alert('Copia non riuscita.'));
  }
}

// Scorte raggruppate per categoria (la "stanza": Cucina, Bagno…). Gruppi comprimibili; lo stato aperto/chiuso
// resta sul dispositivo (non va nel database). Senza categorie la lista resta piatta.
const CHIAVE_GRUPPI = 'casa.scorteChiuse';
const chiaviGruppo = (s) => String(s.categoria || '').trim().toLowerCase();
function gruppiChiusi() {
  try { return new Set(JSON.parse(localStorage.getItem(CHIAVE_GRUPPI) || '[]')); } catch (e) { return new Set(); }
}
function alternaGruppo(k) {
  const c = gruppiChiusi();
  if (c.has(k)) c.delete(k); else c.add(k);
  try { localStorage.setItem(CHIAVE_GRUPPI, JSON.stringify([...c])); } catch (e) { /* ignora */ }
}

function htmlScorteRaggruppate() {
  if (!dati.scorte.length) return '<p class="vuoto" style="padding:12px 0">Nessun articolo.</p>';
  const gruppi = new Map();
  dati.scorte.forEach((s) => {
    const k = chiaviGruppo(s);
    if (!gruppi.has(k)) gruppi.set(k, { k, nome: String(s.categoria || '').trim() || 'Senza categoria', voci: [] });
    gruppi.get(k).voci.push(s);
  });
  if (gruppi.size === 1 && gruppi.has('')) return dati.scorte.map((s) => rigaScorta(s)).join('');
  const chiusi = gruppiChiusi();
  const ordine = [...gruppi.values()].sort((a, b) => (a.k === '') - (b.k === '') || a.nome.localeCompare(b.nome, 'it'));
  return ordine.map((g) => {
    const aperto = !chiusi.has(g.k);
    const basse = g.voci.filter((s) => s.quantita <= s.minimo).length;
    return `<div class="gruppo">
      <button class="gruppo-btn" data-action="scorte-gruppo" data-gruppo="${esc(g.k)}" aria-expanded="${aperto}">
        <span class="freccia" aria-hidden="true">›</span>
        <span class="nome">${esc(g.nome)}</span>
        <span class="conta ${basse ? 'bassa' : ''}">${g.voci.length}${basse ? ` · ${basse} in esaurimento` : ''}</span>
      </button>
      ${aperto ? g.voci.map((s) => rigaScorta(s)).join('') : ''}
    </div>`;
  }).join('');
}

function vaiTab(nome) {
  document.querySelectorAll('.pagina').forEach((p) => { p.hidden = p.id !== nome; });
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === nome));
  window.scrollTo(0, 0);
}

function esporta() {
  const blob = new Blob([JSON.stringify(dati, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'casa-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-vai],[data-stanza],[data-action]');
  if (!t) return;

  if (t.dataset.tab) { vaiTab(t.dataset.tab); return; }
  if (t.dataset.vai) { stanzaSel = t.dataset.vai; render(); vaiTab('stanze'); return; }
  if (t.dataset.stanza) { stanzaSel = t.dataset.stanza; render(); return; }

  const id = t.dataset.id;
  switch (t.dataset.action) {
    case 'modifica-inizia': modifica = { tipo: t.dataset.tipo, id }; render(); focusModifica(); return;
    case 'modifica-annulla': modifica = null; render(); return;
    case 'toggle': {
      const a = trova(dati.attivita, id);
      if (a && a.ripeti) a.fattaIl = statoAttivita(a) === 'fatta' ? '' : oggi(); // ripetuto: vale per questo giro
      else if (a) a.fatta = !a.fatta;
      break;
    }
    case 'ripeti': { const a = trova(dati.attivita, id); if (a) cambiaRipetizione(a); break; }
    case 'elimina': dati.attivita = dati.attivita.filter((a) => a.id !== id); break;
    case 'urgenza': {
      // 1 stella → 2 → 3 → di nuovo 1: l'impegno passa da solo nel gruppo giusto
      const a = trova(dati.attivita, id);
      if (a) a.urgenza = a.urgenza >= 3 ? 1 : a.urgenza + 1;
      break;
    }
    case 'assegna': {
      // Nessuno -> Claudio -> Monica -> Nessuno
      const a = trova(dati.attivita, id);
      if (a) {
        const i = PERSONE.findIndex((p) => p.id === a.assegnata);
        a.assegnata = i + 1 < PERSONE.length ? PERSONE[i + 1].id : '';
      }
      break;
    }
    case 'pulisci':
      if (!confirm('Rimuovere le attività completate di questa stanza?')) return;
      dati.attivita = dati.attivita.filter((a) => !(a.fatta && a.stanza === stanzaSel));
      break;
    case 'meno': {
      const s = trova(dati.scorte, id);
      if (s) s.quantita = Math.max(0, s.quantita - 1);
      break;
    }
    case 'piu': { const s = trova(dati.scorte, id); if (s) s.quantita += 1; break; }
    case 'elimina-scorta': dati.scorte = dati.scorte.filter((s) => s.id !== id); break;
    case 'spesa-aggiungi': { const s = trova(dati.scorte, id); if (s) aggiungiScortaAllaSpesa(s); break; }
    case 'spesa-escludi': { const s = trova(dati.scorte, id); if (s) escludiScortaDallaSpesa(s); break; }
    case 'spesa-toggle': {
      // Se l'articolo viene dalla dispensa, comprarlo ne aumenta la scorta (e rimetterlo in lista la riporta indietro).
      const x = trova(dati.spesa, id);
      if (x) {
        x.comprato = !x.comprato;
        const s = x.scortaId ? trova(dati.scorte, x.scortaId) : null;
        if (s) s.quantita = Math.max(0, s.quantita + (x.comprato ? x.quantita : -x.quantita));
      }
      break;
    }
    case 'spesa-piu': { const x = trova(dati.spesa, id); if (x) { x.quantita += 1; x.auto = false; } break; }
    case 'spesa-meno': { const x = trova(dati.spesa, id); if (x) { x.quantita = Math.max(1, x.quantita - 1); x.auto = false; } break; }
    case 'spesa-elimina': {
      const x = trova(dati.spesa, id);
      const s = x && x.scortaId ? trova(dati.scorte, x.scortaId) : null;
      if (x && s && !x.comprato && s.quantita <= SOGLIA_SPESA) x.tolto = true; // resta nascosta, non rientra da sola
      else dati.spesa = dati.spesa.filter((y) => y.id !== id);
      break;
    }
    case 'spesa-rimetti': dati.spesa.forEach((x) => { delete x.tolto; }); break;
    case 'spesa-pulisci':
      if (!confirm('Togliere dalla lista gli articoli già comprati?')) return;
      dati.spesa = dati.spesa.filter((x) => !x.comprato);
      break;
    case 'esporta': esporta(); return;
    case 'copia-spesa': copiaSpesa(); return;
    case 'scorte-gruppo': alternaGruppo(t.dataset.gruppo); render(); return;
    case 'drive-collega': eseguiDrive(driveAccesso); return;
    case 'drive-carica': eseguiDrive(driveCarica); return;
    case 'drive-scarica':
      if (!confirm('Sostituire i dati di questo dispositivo con quelli salvati su Drive?')) return;
      eseguiDrive(driveScarica);
      return;
    case 'drive-scollega': driveScollega(); return;
    case 'cloud-accedi': accediNube(); return;
    case 'cloud-esci': esciNube(); return;
    default: return;
  }
  salva();
  render();
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  const d = Object.fromEntries(new FormData(f));

  if (f.id === 'formAtt') {
    const titolo = String(d.titolo || '').trim();
    if (!titolo) return;
    const nuovaAttivita = {
      id: uid(), titolo, stanza: stanzaSel,
      urgenza: Number(d.urgenza), fatta: false, creataIl: adesso(),
      assegnata: PERSONE.some((p) => p.id === d.assegnata) ? d.assegnata : '',
    };
    if (ripetizioneValida(d.ripeti)) {
      nuovaAttivita.ripeti = d.ripeti;
      nuovaAttivita.inizio = dataValida(d.inizio) ? d.inizio : oggi();
      nuovaAttivita.fattaIl = '';
    }
    dati.attivita.push(nuovaAttivita);
  } else if (f.id === 'formScorta') {
    const nome = String(d.nome || '').trim();
    if (!nome) return;
    const nuova = {
      id: uid(), nome,
      categoria: String(d.categoria || '').trim(),
      quantita: Math.max(0, parseInt(d.quantita, 10) || 0),
      minimo: Math.max(0, parseInt(d.minimo, 10) || 0),
      unita: String(d.unita || '').trim(),
    };
    dati.scorte.push(nuova);
  } else if (f.classList.contains('modifica')) {
    const nuovo = String(d.testo || '').replace(/\s+/g, ' ').trim();
    if (!nuovo) return; // il campo resta aperto
    rinomina(f.dataset.tipo, f.dataset.id, nuovo);
    modifica = null;
  } else if (f.id === 'formSpesa') {
    const nome = String(d.nome || '').trim();
    if (!nome) return;
    const quantita = Math.max(1, parseInt(d.quantita, 10) || 1);
    const minuscolo = nome.toLowerCase();
    const scorta = dati.scorte.find((s) => s.nome.toLowerCase() === minuscolo);
    const esistente = dati.spesa.find((x) => !x.comprato && (scorta ? x.scortaId === scorta.id : x.nome.toLowerCase() === minuscolo));
    if (esistente && esistente.tolto) {
      delete esistente.tolto; // era stata tolta a mano: la rimetti con la quantità scelta ora
      esistente.quantita = quantita;
      esistente.auto = false;
    } else if (esistente) {
      esistente.quantita += quantita; // niente doppioni: si somma
      esistente.auto = false;
    } else {
      dati.spesa.push({
        id: uid(), nome: scorta ? scorta.nome : nome, quantita,
        unita: String(d.unita || '').trim() || (scorta ? scorta.unita : ''),
        comprato: false, scortaId: scorta ? scorta.id : '', creataIl: adesso(),
      });
    }
  } else {
    return;
  }
  salva();
  render();
});

const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE = 'casa.json';

let driveToken = null;
let driveScade = 0;
let driveMsg = '';

const adesso = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');

function driveCollegato() {

function impostaFlagDrive(v) {

function normalizza(j) {
  if (!j || !Array.isArray(j.attivita) || !Array.isArray(j.scorte)) throw new Error('formato non valido');
  return {
    attivita: j.attivita.map((a) => ({

      // Campi delle ripetizioni: presenti solo per gli impegni che si ripetono.
      ...(ripetizioneValida(a.ripeti)
        ? { ripeti: a.ripeti, inizio: dataValida(a.inizio) ? a.inizio : oggi(), fattaIl: dataValida(a.fattaIl) ? a.fattaIl : '' }
        : {}),
    })),

      unita: String(s.unita || '').slice(0, 80),
      // Presente solo se hai premuto "Non aggiungere", così le scorte normali restano uguali.
      ...(s.nonInLista ? { nonInLista: true } : {}),
    })),
    spesa: (Array.isArray(j.spesa) ? j.spesa : []).map((x) => ({
      id: x.id || uid(),

      scortaId: String(x.scortaId || ''),
      creataIl: x.creataIl || adesso(),
      // Presenti solo quando servono, così le voci normali restano uguali.
      ...(x.auto ? { auto: true } : {}),
      ...(x.tolto ? { tolto: true } : {}),
    })),
  };
}

function driveAccesso() {
  return new Promise((ok, ko) => {
    if (driveToken && Date.now() < driveScade - 60000) { ok(driveToken); return; }
    if (!GOOGLE_CLIENT_ID) { ko(new Error("Manca l'ID client Google nel codice (vedi README).")); return; }
    if (!window.google || !google.accounts) { ko(new Error('Libreria Google non caricata: sei online?')); return; }

    accessoOk = ok;
    accessoKo = ko;
    if (!tokenClient) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: (r) => {
          if (r.error) { accessoKo(new Error(r.error_description || r.error)); return; }
          driveToken = r.access_token;
          driveScade = Date.now() + (Number(r.expires_in) || 3600) * 1000;
          impostaFlagDrive(true);
          accessoOk(driveToken);
        },
        error_callback: (e) => accessoKo(new Error('Accesso annullato o bloccato (' + (e.type || 'errore') + ').')),
      });
    }
    tokenClient.requestAccessToken({ prompt: driveCollegato() ? '' : 'consent' });
  });
}

async function driveFetch(url, opzioni = {}) {
  const token = await driveAccesso();
  const r = await fetch(url, { ...opzioni, headers: { ...(opzioni.headers || {}), Authorization: 'Bearer ' + token } });
  if (!r.ok) throw new Error('Errore di Google Drive (' + r.status + ').');
  return r;
}

async function driveIdFile() {
  const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`);
  const j = await r.json();
  return j.files && j.files[0] ? j.files[0].id : null;
}

async function driveCarica() {
  const id = await driveIdFile();
  const meta = id ? { name: DRIVE_FILE } : { name: DRIVE_FILE, parents: ['appDataFolder'] };
  const json = JSON.stringify({ versione: 1, attivita: dati.attivita, scorte: dati.scorte, spesa: dati.spesa });
  const b = 'casa' + uid();
  const corpo = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`
    + `--${b}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${b}--`;
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files${id ? '/' + id : ''}?uploadType=multipart`, {
    method: id ? 'PATCH' : 'POST',
    headers: { 'Content-Type': 'multipart/related; boundary=' + b },
    body: corpo,
  });
}

async function driveScarica() {
  const id = await driveIdFile();
  if (!id) throw new Error('Nessun file su Drive: prima carica i dati.');
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  dati = normalizza(await r.json());
  salva();
}

function driveScollega() {
  if (driveToken && window.google && google.accounts) {
    try { google.accounts.oauth2.revoke(driveToken, () => {}); } catch (e) { /* ignora */ }
  }
  driveToken = null;
  driveScade = 0;
  impostaFlagDrive(false);
  driveMsg = 'Drive scollegato.';
  render();
}

function normalizzaLista(tipo, lista) {
  const n = normalizza({ attivita: [], scorte: [], spesa: [], [tipo]: lista });
  const perData = (a, b) => String(a.creataIl).localeCompare(String(b.creataIl)) || a.id.localeCompare(b.id);
  const perNome = (a, b) => a.nome.localeCompare(b.nome, 'it') || a.id.localeCompare(b.id);
  return n[tipo].sort(tipo === 'scorte' ? perNome : perData);
}

function unisciListe(remote, locali) {
  const ids = new Set(remote.map((x) => x.id));
  return remote.concat(locali.filter((x) => !ids.has(x.id)));
}

function messaggioErroreNube(e) {

  if (c.includes('permission-denied')) return "Questo account non è autorizzato: accedi con l'account di Claudio o di Monica.";
  if (c.includes('unauthorized-domain')) return 'Questo indirizzo non è autorizzato in Firebase.';
  if (c.includes('network')) return 'Nessuna connessione: riprova più tardi.';
  return (e && e.message) || 'Operazione non riuscita.';
}

async function avviaNube() {
  let fbApp; let fbAuth; let fbStore;
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VERSIONE}`;
    [fbApp, fbAuth, fbStore] = await Promise.all([
      import(`${base}/firebase-app.js`),
      import(`${base}/firebase-auth.js`),
      import(`${base}/firebase-firestore.js`),
    ]);
  } catch (e) {
    nube.stato = 'offline';
    render();
    return;
  }

  const { initializeApp } = fbApp;
  const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } = fbAuth;
  const { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
    collection, doc, setDoc, deleteDoc, getDocs, onSnapshot } = fbStore;

  const app = initializeApp(FB_CONFIG);
  const auth = getAuth(app);
  const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  let spegni = [];

  const errore = (e) => {
    nube.msg = messaggioErroreNube(e);
    if (e && e.code === 'permission-denied') signOut(auth);
    render();
  };

  // Manda al database solo le voci cambiate o eliminate rispetto all'ultimo stato noto.
  const sincronizza = () => {
    if (!nube.pronta) return;
    for (const t of TIPI_CLOUD) {
      const correnti = new Map(dati[t].map((x) => [x.id, x]));
      for (const [id, x] of correnti) {
        const s = stabile(x);
        if (ultimoCloud[t].get(id) !== s) {
          ultimoCloud[t].set(id, s);
          setDoc(doc(db, t, id), x).catch(errore);
        }
      }
      for (const id of [...ultimoCloud[t].keys()]) {
        if (!correnti.has(id)) {
          ultimoCloud[t].delete(id);
          deleteDoc(doc(db, t, id)).catch(errore);
        }
      }
    }
  };

  const avvia = async () => {
    try {
      const remote = {};
      for (const t of TIPI_CLOUD) {
        const snap = await getDocs(collection(db, t));
        remote[t] = normalizzaLista(t, snap.docs.map((d) => ({ ...d.data(), id: d.id })));
      }
      const haLocali = dati.attivita.length + dati.scorte.length + dati.spesa.length > 0;
      const daChiedere = haLocali && (!leggiFlag(FLAG_INIT) || leggiFlag(FLAG_SPORCO));
      const unire = daChiedere && confirm(
        'Vuoi aggiungere alle liste condivise anche i dati già presenti su questo telefono?\n\nOK = aggiungili\nAnnulla = usa solo le liste condivise',
      );
      for (const t of TIPI_CLOUD) {
        ultimoCloud[t] = new Map(remote[t].map((x) => [x.id, stabile(x)]));
        dati[t] = unire ? unisciListe(remote[t], normalizzaLista(t, dati[t])) : remote[t];
      }
      scriviFlag(FLAG_INIT, true);
      scriviFlag(FLAG_SPORCO, false);
      nube.pronta = true;
      nube.stato = 'attiva';
      nube.msg = '';
      riallineaSpesa();
      salvaLocale();
      sincronizza();
      render();
      for (const t of TIPI_CLOUD) {
        spegni.push(onSnapshot(collection(db, t), (snap) => {
          const lista = normalizzaLista(t, snap.docs.map((d) => ({ ...d.data(), id: d.id })));
          ultimoCloud[t] = new Map(lista.map((x) => [x.id, stabile(x)]));
          dati[t] = lista;
          if (riallineaSpesa()) sincronizza(); // se cambiano le scorte, la lista si adegua anche qui
          salvaLocale();
          renderSicuro();
        }, errore));
      }
    } catch (e) {
      nube.pronta = false;
      nube.stato = 'sconnesso';
      errore(e);
    }
  };

  nube.api = {
    accedi: () => signInWithPopup(auth, provider),
    esci: () => signOut(auth),
  };
  nube.sincronizza = sincronizza;

  onAuthStateChanged(auth, (utente) => {
    spegni.forEach((f) => f());
    spegni = [];
    nube.pronta = false;
    if (!utente) {
      nube.utente = '';
      nube.stato = 'sconnesso';
      render();
      return;
    }
    nube.utente = utente.email || '';
    nube.stato = 'connessione';
    render();
    avvia();
  });
}

// A mezzanotte gli impegni ripetuti tornano da fare: se l'app resta aperta, si aggiorna da sola al cambio di giorno.
let giornoCorrente = oggi();
function controllaGiorno() {
  if (oggi() === giornoCorrente) return;
  giornoCorrente = oggi();
  renderSicuro();
}
setInterval(controllaGiorno, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) controllaGiorno(); });

if (riallineaSpesa()) salvaLocale(); // scorte già basse prima dell'aggiornamento entrano subito in lista
render();
vaiTab('generale');
avviaNube();
</script>
